# KernelSU-family manager on an AVD (x86_64 LKM loaded by `ksud late-load`,
# KernelSU's jailbreak mode), then per host (matrix): the probe module's WebUI
# opened in that host and the WebUI host checks run in it, plus each
# lab-inputs module opened. Hosts: kernelsu (the manager itself), webuix
# (WebUI X Portable, root through KernelSU's su).
name: avd-ksu
on:
  workflow_dispatch:
    inputs:
      flavor: { default: kernelsu, description: "kernelsu | next" }
      host: { default: all, description: "all | kernelsu | webuix (WebUI host legs to run)" }
      tag: { default: "", description: "release tag, empty = latest" }
      api: { default: "35" }
      label: { default: "", description: "extra name for the lab-results run, e.g. demo-0.9" }
      metamodule: { default: "", description: "KernelSU metamodule to install first, e.g. meta-overlayfs (empty = none)" }
      hold_tag: { default: "", description: "webui-termux-api release tag (e.g. webui-v0.53.0-webui.8): run checks/hold_socket.sh with its APK" }
      demo_tag: { default: "", description: "demo release tag to install (e.g. v0.1.28) instead of the module branch; also runs the manager update check and checks/lifecycle.sh" }
      backclose: { default: "", description: "non-empty: only checks/backclose.sh on the demo (skips the WebUI checks)" }
      update_to: { default: "", description: "demo release tag to install over demo_tag with ksud module install (checks/update_to.sh) instead of the manager update check and lifecycle" }
      modules: { default: "flutter_webui_counter-0.1.5.zip counter-v1.0.0.zip demo.zip", description: "zip names under modules/ on the lab-inputs branch, space separated" }
  push:
    branches: [main]
    paths: [".github/workflows/avd-ksu.yml", "managers/**", "checks/**", "driver/**", "modules/**", "tools/labserver/**", "tools/sockprobe/**"]
permissions:
  contents: write
jobs:
  ksu:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON((inputs.host == '' || inputs.host == 'all') && '["kernelsu","webuix"]' || format('["{0}"]', inputs.host)) }}
    env:
      LAB_OUT: ${{ github.workspace }}/out
      GH_TOKEN: ${{ github.token }}
      FLAVOR: ${{ inputs.flavor || 'kernelsu' }}
      HOST: ${{ matrix.host }}
      MODULES: ${{ inputs.modules || 'flutter_webui_counter-0.1.5.zip counter-v1.0.0.zip demo.zip' }}
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          mkdir -p "$LAB_OUT"
      - uses: actions/setup-go@v5
        with: { go-version: "1.23", cache: false }
      - name: Build labserver
        run: |
          cd tools/labserver && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$LAB_OUT/labserver" . && echo "LABSERVER=$LAB_OUT/labserver" >> "$GITHUB_ENV"
          cd ../sockprobe && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$LAB_OUT/sockprobe" . && echo "SOCKPROBE=$LAB_OUT/sockprobe" >> "$GITHUB_ENV"
      # The system image is ~1.5 GB from dl.google.com on every run otherwise.
      - name: Cache system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ inputs.api || '35' }}/google_apis/x86_64
          key: sysimg-${{ inputs.api || '35' }}-google_apis-x86_64-v1
      - name: Boot AVD
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set -o pipefail; PATH=$ANDROID_HOME/platform-tools:$PATH platforms/avd/up.sh "${{ inputs.api || '35' }}" google_apis x86_64 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Manager
        run: managers/ksu.sh "$FLAVOR" "${{ inputs.tag }}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: WebUI X Portable
        if: matrix.host == 'webuix'
        run: managers/webuix.sh 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Install modules
        if: env.MODULES != ''
        run: |
          git fetch -q --depth 1 origin lab-inputs && mkdir -p inputs && git archive FETCH_HEAD modules | tar -x -C inputs
          # The demo module comes from demo CI (its `module` branch), not lab-inputs.
          if [ -n "${{ inputs.demo_tag }}" ]; then
            gh release download -R p0g-stack/demo "${{ inputs.demo_tag }}" -D "$RUNNER_TEMP/demo-rel" -p 'demo-v*.zip'
            z=$(ls "$RUNNER_TEMP"/demo-rel/demo-v*.zip | head -1); cp "$z" inputs/modules/demo.zip
            echo "demo zip: release ${{ inputs.demo_tag }} $(basename "$z")" | tee -a "$LAB_OUT/inputs.txt"
          else
          git clone -q --depth 1 -b module https://github.com/p0g-stack/demo "$RUNNER_TEMP/demo-module"
          (cd "$RUNNER_TEMP/demo-module" && sha256sum -c SHA256SUMS && git log -1 --format='demo module: %s' && z=$(ls demo-*.zip | head -1) && cp "$z" "$GITHUB_WORKSPACE/inputs/modules/demo.zip" && echo "demo zip: $z") | tee -a "$LAB_OUT/inputs.txt"
          fi
          sha256sum inputs/modules/*.zip | tee -a "$LAB_OUT/inputs.txt"
          zips=(); for m in $MODULES; do zips+=("inputs/modules/$m"); done
          # The lab's self-mounting app_plane module rbinds a tmpfs over /product/app; with a
          # metamodule mounting the same dir system_server crash-loops, so it only runs without one.
          if [ "$HOST" = kernelsu ] && [ -z "${{ inputs.metamodule }}" ]; then
            gh release download -R p0g-stack/webui-termux-api webui-v0.53.0-webui.1 -D apk -p '*.apk' && ls apk
            checks/app_plane.sh build "$(ls apk/*.apk | head -1)" "$SOCKPROBE" "$PWD/app_plane.zip" && zips+=("$PWD/app_plane.zip")
          fi
          if [ -n "${{ inputs.metamodule }}" ]; then managers/metamodule.sh "${{ inputs.metamodule }}" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
          (cd modules/envdump && zip -qr "$GITHUB_WORKSPACE/envdump.zip" .) && zips+=("$GITHUB_WORKSPACE/envdump.zip")
          managers/install_modules.sh "${zips[@]}" 2>&1 | tee -a "$LAB_OUT/job.log"
          adb shell cat /data/local/tmp/customize-env.txt >"$LAB_OUT/customize-env.txt" 2>&1 || true
      - name: WebUI checks
        if: inputs.backclose == ''
        timeout-minutes: 55
        run: |
          case $HOST in
            webuix) PKG=com.dergoogler.mmrl.wx;;
            *) case $FLAVOR in kernelsu) PKG=me.weishu.kernelsu;; next) PKG=com.rifsxd.ksunext;; esac;;
          esac
          checks/webui_host.sh "$HOST" "$PKG" 2>&1 | tee -a "$LAB_OUT/job.log"
          for m in $MODULES; do
            id=$(unzip -p "inputs/modules/$m" module.prop | sed -n 's/^id=//p' | tr -d '\r')
            name=$(unzip -p "inputs/modules/$m" module.prop | sed -n 's/^name=//p' | tr -d '\r')
            MODULE=$id checks/open_module.sh "$HOST-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"
            if [ "$id" = flutter_webui_counter ]; then checks/flutter_webui.sh "$HOST-$id" "$id" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ]; then checks/demo_walk.sh "$HOST-$id" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ]; then checks/fs_persistent.sh "$HOST-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ]; then checks/theme.sh "$HOST-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ]; then checks/root_channel.sh "$HOST-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ]; then UNINSTALL=$([ -n "${{ inputs.demo_tag }}" ] && echo 0 || echo 1) NAME="$name" checks/app_plane_module.sh "$HOST-$id" "$PKG" "$id" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
            if [ "$id" = demo ] && [ -n "${{ inputs.demo_tag }}" ] && [ -z "${{ inputs.update_to }}" ] && [ "$HOST" = kernelsu ]; then checks/module_update.sh "$HOST-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"; fi
          done
      - name: Back close
        if: inputs.backclose != ''
        timeout-minutes: 30
        run: |
          case $HOST in
            webuix) PKG=com.dergoogler.mmrl.wx;;
            *) case $FLAVOR in kernelsu) PKG=me.weishu.kernelsu;; next) PKG=com.rifsxd.ksunext;; esac;;
          esac
          name=$(unzip -p inputs/modules/demo.zip module.prop | sed -n 's/^name=//p' | tr -d '\r')
          checks/backclose.sh "$HOST-demo" "$PKG" demo "$name" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Lifecycle
        if: always() && inputs.demo_tag != '' && inputs.update_to == ''
        timeout-minutes: 35
        run: |
          case $HOST in
            webuix) PKG=com.dergoogler.mmrl.wx;;
            *) case $FLAVOR in kernelsu) PKG=me.weishu.kernelsu;; next) PKG=com.rifsxd.ksunext;; esac;;
          esac
          name=$(unzip -p inputs/modules/demo.zip module.prop | sed -n 's/^name=//p' | tr -d '\r')
          checks/lifecycle.sh "$HOST-demo" "$PKG" demo "$name" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Update to
        if: always() && inputs.update_to != ''
        run: |
          gh release download -R p0g-stack/demo "${{ inputs.update_to }}" -D "$RUNNER_TEMP/demo-upd" -p 'demo-v*.zip'
          checks/update_to.sh "$HOST-demo" demo "$(ls "$RUNNER_TEMP"/demo-upd/demo-v*.zip | head -1)" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Hold socket
        if: always() && inputs.hold_tag != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download -R p0g-stack/webui-termux-api "${{ inputs.hold_tag }}" -D hold-apk -p '*.apk' && ls -la hold-apk
          checks/hold_socket.sh "$HOST" "$(ls hold-apk/*.apk | head -1)" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: App plane
        if: always() && matrix.host == 'kernelsu' && inputs.metamodule == ''
        run: checks/app_plane.sh run 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Result
        if: always()
        run: cat "$LAB_OUT"/*.json 2>/dev/null; tail -50 "$LAB_OUT"/emulator.log 2>/dev/null | tail -5 || true
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ matrix.host }}${{ inputs.label && format('-{0}', inputs.label) || '' }}"
