# KernelSU-family manager on an AVD (late-loaded x86_64 LKM), the probe
# module's WebUI opened in the manager, and the WebUI host checks run in it.
name: avd-ksu
on:
  workflow_dispatch:
    inputs:
      flavor: { default: kernelsu, description: "kernelsu | next" }
      tag: { default: "", description: "release tag, empty = latest" }
      api: { default: "35" }
      modules: { default: "flutter_webui_counter-0.1.0.zip counter-v1.0.0.zip", description: "zip names under modules/ on the lab-inputs branch, space separated" }
  push:
    branches: [main]
    paths: [".github/workflows/avd-ksu.yml", "managers/**", "checks/**", "driver/**", "modules/**", "tools/labserver/**"]
permissions:
  contents: write
jobs:
  ksu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LAB_OUT: ${{ github.workspace }}/out
      GH_TOKEN: ${{ github.token }}
      FLAVOR: ${{ inputs.flavor || 'kernelsu' }}
      MODULES: ${{ inputs.modules || 'flutter_webui_counter-0.1.0.zip counter-v1.0.0.zip' }}
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          mkdir -p "$LAB_OUT"
      - uses: actions/setup-go@v5
        with: { go-version: "1.23", cache: false }
      - name: Build labserver
        run: cd tools/labserver && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$LAB_OUT/labserver" . && echo "LABSERVER=$LAB_OUT/labserver" >> "$GITHUB_ENV"
      - name: Boot AVD
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set -o pipefail; PATH=$ANDROID_HOME/platform-tools:$PATH platforms/avd/up.sh "${{ inputs.api || '35' }}" google_apis x86_64 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Manager
        run: managers/ksu.sh "$FLAVOR" "${{ inputs.tag }}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Install modules
        if: env.MODULES != ''
        run: |
          git fetch -q --depth 1 origin lab-inputs && mkdir -p inputs && git archive FETCH_HEAD modules | tar -x -C inputs
          zips=(); for m in $MODULES; do zips+=("inputs/modules/$m"); done
          managers/install_modules.sh "${zips[@]}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: WebUI checks
        run: |
          case $FLAVOR in
            kernelsu) PKG=me.weishu.kernelsu;; next) PKG=com.rifsxd.ksunext;;
          esac
          checks/webui_host.sh "$FLAVOR" "$PKG" 2>&1 | tee -a "$LAB_OUT/job.log"
          for m in $MODULES; do
            id=$(unzip -p "inputs/modules/$m" module.prop | sed -n 's/^id=//p' | tr -d '\r')
            name=$(unzip -p "inputs/modules/$m" module.prop | sed -n 's/^name=//p' | tr -d '\r')
            MODULE=$id checks/open_module.sh "$FLAVOR-$id" "$PKG" "$id" "$name" 2>&1 | tee -a "$LAB_OUT/job.log"
          done
      - name: Result
        if: always()
        run: cat "$LAB_OUT"/*.json 2>/dev/null; tail -50 "$LAB_OUT"/emulator.log 2>/dev/null | tail -5 || true
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ github.job }}"
