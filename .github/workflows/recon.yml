# Looks up what the lab can download: manager and WebUI X release assets,
# KernelSU build workflows, and the kernel each AVD image ships. Output is
# the job log plus out/recon.txt.
name: recon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/recon.yml"]
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-24.04
    env:
      LAB_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - name: Release assets and workflows
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p out
          for r in tiann/KernelSU KernelSU-Next/KernelSU-Next SukiSU-Ultra/SukiSU-Ultra bmax121/APatch 5ec1cff/KsuWebUIStandalone; do
            echo "### $r" | tee -a out/recon.txt
            gh api "repos/$r/releases?per_page=2" --jq '.[] | "\(.tag_name) \(.published_at)\n" + ([.assets[].name] | join("\n"))' 2>&1 | tee -a out/recon.txt
            gh api "repos/$r/contents/.github/workflows" --jq '.[].name' 2>/dev/null | tr '\n' ' ' | tee -a out/recon.txt; echo | tee -a out/recon.txt
          done
      - name: Find WebUI X / MMRL repos
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for q in "MMRL in:name" "WebUI-X in:name" "KsuWebUIStandalone in:name"; do
            echo "### search $q" | tee -a out/recon.txt
            gh api -X GET search/repositories -f q="$q" -f sort=stars -f per_page=6 --jq '.items[] | "\(.full_name) \(.stargazers_count)"' | tee -a out/recon.txt
          done
          for r in DerGoogler/MMRL MMRL-App/mmrl; do
            echo "### $r" | tee -a out/recon.txt
            gh api "repos/$r/releases?per_page=1" --jq '.[] | "\(.tag_name) \(.published_at)\n" + ([.assets[].name] | join("\n"))' 2>&1 | tee -a out/recon.txt
          done
      - name: AVD kernels
        run: |
          for api in 34 35 36 Baklava; do
            img="system-images;android-$api;google_apis;x86_64"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$img" < <(yes) >/dev/null 2>&1 || { echo "$api: no image"; continue; }
            d="$ANDROID_HOME/system-images/android-$api/google_apis/x86_64"
            echo "### api $api: $(ls "$d" | tr '\n' ' ')" | tee -a out/recon.txt
            sudo apt-get install -y -qq linux-tools-common >/dev/null 2>&1 || true
            python3 - "$d/kernel-ranchu" <<'PY' | tee -a out/recon.txt
          import sys, gzip, lzma, zlib, re
          b = open(sys.argv[1], 'rb').read()
          for magic, dec in ((b'\x1f\x8b\x08', lambda x: zlib.decompressobj(31).decompress(x)), (b'\xfd7zXZ', lzma.decompress)):
              i = b.find(magic)
              while i != -1:
                  try:
                      m = re.search(rb'Linux version [^\n\x00]+', dec(b[i:])); 
                      if m: print(m.group().decode(errors='replace')); sys.exit()
                  except Exception: pass
                  i = b.find(magic, i + 1)
          m = re.search(rb'Linux version [^\n\x00]+', b); print(m.group().decode() if m else 'version string not found')
          PY
            (cat "$d/source.properties"; grep -h -m3 'ro.build' "$d"/build.prop 2>/dev/null) | tee -a out/recon.txt
          done
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ github.job }}"
