# AERA on Cuttlefish (aera/README.md). Boots x86_64 Cuttlefish and its stock
# recovery, records what a plugin host sees there, then runs the counter
# through flutter-aera's x86_64 kit and host simulator inside that recovery.
name: aera-cf
on:
  workflow_dispatch:
    inputs:
      build: { default: "aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug" }
      build_id: { default: "" }
      aera_release: { default: "latest", description: "devicelab release with ramdisk-recovery.img (aera-cf-x86_64-*), latest, or none" }
      aera_taps: { default: "", description: "launcher taps 'x,y x,y' in AERA screen pixels, used when the image has no RPC plugin open (patch 0008)" }
  push:
    branches: [main]
    paths: [".github/workflows/aera-cf.yml", "aera/cuttlefish/**", "aera/kit/**", "aera/tools/**"]
permissions:
  contents: write
concurrency: { group: aera-cf, cancel-in-progress: false }
jobs:

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LAB_OUT: ${{ github.workspace }}/out
      CF_HOME: /mnt/cf
      P0G_TOKEN: ${{ secrets.P0G_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: KVM and disk
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo mkdir -p "$CF_HOME" && sudo chown "$USER" "$CF_HOME"
          # Cuttlefish wants ~8.5 GB for userdata alone; the runner starts with 14 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          mkdir -p "$LAB_OUT"; df -h / /mnt; nproc; free -g
      - name: Boot Cuttlefish
        run: set -o pipefail; aera/cuttlefish/up.sh "${{ inputs.build }}" "${{ inputs.build_id }}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Android frame
        run: aera/cuttlefish/shot.sh "$LAB_OUT/android.png"
      - name: Stock recovery
        run: set -o pipefail; aera/cuttlefish/recovery.sh stock-recovery 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: flutter-aera x64 kit + static sim (release kit-3.47.5, re-downloaded every run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kitx64/kit"; cd "$RUNNER_TEMP/kitx64"
          gh release view kit-3.47.5 -R p0g-stack/flutter-aera --json assets --jq '.assets[] | "\(.name) \(.updatedAt)"' | tee "$LAB_OUT/kit-release.txt"
          gh release download kit-3.47.5 -R p0g-stack/flutter-aera --clobber -p 'flutter-aera-kit-linux-x64-*' -p 'aera-host-sim-linux-x64*'
          sha256sum -c ./*.sha256 2>&1 | tee -a "$LAB_OUT/kit-release.txt" || true
          tar -C kit -xJf flutter-aera-kit-linux-x64-*.tar.xz
          sim=$(ls aera-host-sim-linux-x64* | grep -v sha256 | head -1); mv "$sim" aera-host-sim; chmod +x aera-host-sim
          file aera-host-sim kit/usr/bin/* | tee -a "$LAB_OUT/kit-release.txt"
      - name: Counter .aerap from flutter_p0g, retargeted to the x64 kit (lab-inputs aera/)
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin lab-inputs && git archive FETCH_HEAD aera | tar -x -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum -c aera/counter-1.0.0.aerap.sha256)
          aera/tools/aerap.py retarget "$RUNNER_TEMP/aera/counter-1.0.0.aerap" "$RUNNER_TEMP/kitx64/kit" "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/job.log"
          aera/tools/aerap.py unpack "$LAB_OUT/counter-1.0.0-x64.aerap" "$RUNNER_TEMP/counter-x64"
      - name: Counter through the kit in recovery (simulated host, frames to PNG)
        run: |
          taps="--until 9000 --snap start@4000 --tap 980,2250@4500 --tap 980,2250@5000 --tap 980,2250@5500 --snap after@8000"
          sim() { aera/cuttlefish/run-sim.sh "$1" "$RUNNER_TEMP/counter-x64/root" "$RUNNER_TEMP/kitx64/aera-host-sim" $taps $2 2>&1 | tee -a "$LAB_OUT/job.log" || true; }
          # GPU (gfxstream modes): launcher default (Vulkan on gfxstream), Impeller on it, GL forced.
          sim counter-default --gpu
          SWITCHES=--enable-impeller sim counter-impeller --gpu
          # Zink diagnostics: GL forced, Mesa/EGL debug logging.
          SWITCHES=--gl ENVIRONMENT=$'EGL_LOG_LEVEL=debug\nMESA_DEBUG=1\nMESA_LOG_LEVEL=debug' sim counter-gl-debug --gpu
          SWITCHES=--gl ENVIRONMENT=$'D3D_ALWAYS_SOFTWARE=1\nVK_LOADER_DEBUG=error,warn,driver\nLIBGL_DEBUG=verbose\nMESA_LOG_LEVEL=debug\nEGL_LOG_LEVEL=debug' sim counter-gl-zink-sw --gpu
          # CPU reference: softpipe.
          sim counter-softpipe ""
      - name: AERA image (devicelab release from aera/build/publish.sh)
        id: aera
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ inputs.aera_release || 'latest' }}"
          [ "$tag" = none ] && exit 0
          if [ "$tag" = latest ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("aera-cf-x86_64-"))] | sort_by(.createdAt) | last | .tagName // ""')
          fi
          [ -n "$tag" ] || { echo "no AERA release yet"; exit 0; }
          mkdir -p "$RUNNER_TEMP/aera-img" && cd "$RUNNER_TEMP/aera-img"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p ramdisk-recovery.img -p BUILD-INFO -p SHA256SUMS
          grep ramdisk-recovery.img SHA256SUMS | sha256sum -c -
          cp BUILD-INFO "$LAB_OUT/aera-BUILD-INFO"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "release $tag"; cat BUILD-INFO
      - name: Boot AERA recovery
        if: steps.aera.outputs.tag != ''
        run: |
          set -o pipefail
          aera/cuttlefish/boot-aera.sh "$RUNNER_TEMP/aera-img/ramdisk-recovery.img" 2>&1 | tee -a "$LAB_OUT/job.log"
          aera/cuttlefish/recovery.sh aera-recovery 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Counter from AERA's launcher (Host API 3, LVGL pixel scene)
        if: steps.aera.outputs.tag != ''
        env: { AERA_TAPS: "${{ inputs.aera_taps }}" }
        run: |
          set -o pipefail
          aera/cuttlefish/aera-open.sh aera-counter "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/job.log"
      # flutter_p0g is private: needs a devicelab secret P0G_READ_TOKEN that can read it.
      - name: flutter_p0g checkout
        id: p0g
        if: steps.aera.outputs.tag != '' && env.P0G_TOKEN != ''
        run: |
          git clone -q --depth 1 "https://x-access-token:$P0G_TOKEN@github.com/p0g-stack/flutter_p0g" "$RUNNER_TEMP/flutter_p0g"
          echo "rev=$(git -C "$RUNNER_TEMP/flutter_p0g" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.p0g.outputs.rev != ''
        with: { flutter-version: 3.47.5, channel: stable }
      - name: flutter_p0g install --ram --open (same package, against the same AERA)
        if: steps.p0g.outputs.rev != ''
        run: |
          set -o pipefail
          export PATH=$CF_HOME/bin:$PATH
          cd "$RUNNER_TEMP/flutter_p0g" && flutter pub get >/dev/null
          echo "flutter_p0g ${{ steps.p0g.outputs.rev }}" | tee "$LAB_OUT/flutter_p0g-install.log"
          dart run bin/flutter_p0g.dart devices 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log" || true
          dart run bin/flutter_p0g.dart install -d 0.0.0.0:6520 --ram --open "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log" || true
          adb -s 0.0.0.0:6520 shell 'ls -la /tmp/aera/plugins /tmp/aera/plugins/counter' 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log"
          sleep 20; cd "$GITHUB_WORKSPACE" && aera/cuttlefish/aera-shot.sh flutter_p0g-opened || true
      - name: Logs
        if: always()
        run: |
          rm -f "$LAB_OUT"/*.aerap
          cp "$CF_HOME"/cuttlefish_runtime/{kernel.log,launcher.log,logcat} "$LAB_OUT"/ 2>/dev/null || true
          tail -30 "$LAB_OUT"/kernel.log 2>/dev/null || true
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ github.job }}"
