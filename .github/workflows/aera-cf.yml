# AERA on Cuttlefish (aera/README.md). Boots x86_64 Cuttlefish and its stock
# recovery, records what a plugin host sees there, then runs the counter
# through flutter-aera's x86_64 kit and host simulator inside that recovery.
name: aera-cf
on:
  workflow_dispatch:
    inputs:
      build: { default: "aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug" }
      build_id: { default: "" }
      pick_taps: { default: "", description: "aera-picker-check.sh PICK_TAPS (name:x,y ...)" }
      recents_card: { default: "", description: "aera-lifecycle-check.sh RECENTS_CARD x,y of the app card in Recents" }
      press_shift: { default: "0", description: "1 = checks shift every press by 1 px (D9 fallback for images without flutter-aera 0025)" }
      aera_release: { default: "latest", description: "devicelab release with ramdisk-recovery.img (aera-cf-x86_64-*), latest, or none" }
      aera_taps: { default: "", description: "launcher taps 'x,y x,y' in AERA screen pixels, used when the image has no RPC plugin open (patch 0008)" }
  release:
    types: [published]
  push:
    branches: [main]
    paths: [".github/workflows/aera-cf.yml", "aera/cuttlefish/**", "aera/kit/**", "aera/tools/**"]
permissions:
  contents: write
concurrency: { group: aera-cf, cancel-in-progress: false }
jobs:

  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRESS_SHIFT: ${{ inputs.press_shift || '0' }}
      LAB_OUT: ${{ github.workspace }}/out
      CF_HOME: /mnt/cf
    steps:
      - uses: actions/checkout@v4
      - name: KVM and disk
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo mkdir -p "$CF_HOME" && sudo chown "$USER" "$CF_HOME"
          # Cuttlefish wants ~8.5 GB for userdata alone; the runner starts with 14 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          mkdir -p "$LAB_OUT"; df -h / /mnt; nproc; free -g
      - name: Boot Cuttlefish
        run: set -o pipefail; aera/cuttlefish/up.sh "${{ inputs.build }}" "${{ inputs.build_id }}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Android frame
        run: aera/cuttlefish/shot.sh "$LAB_OUT/android.png"
      - name: Stock recovery
        run: set -o pipefail; aera/cuttlefish/recovery.sh stock-recovery 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: flutter-aera x64 kit + static sim (release kit-3.47.5, re-downloaded every run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kitx64/kit"; cd "$RUNNER_TEMP/kitx64"
          gh release view kit-3.47.5 -R p0g-stack/flutter-aera --json assets --jq '.assets[] | "\(.name) \(.updatedAt)"' | tee "$LAB_OUT/kit-release.txt"
          gh release download kit-3.47.5 -R p0g-stack/flutter-aera --clobber -p 'flutter-aera-kit-linux-x64-*' -p 'aera-host-sim-linux-x64*'
          sha256sum -c ./*.sha256 2>&1 | tee -a "$LAB_OUT/kit-release.txt" || true
          tar -C kit -xJf flutter-aera-kit-linux-x64-*.tar.xz
          sim=$(ls aera-host-sim-linux-x64* | grep -v sha256 | head -1); mv "$sim" aera-host-sim; chmod +x aera-host-sim
          file aera-host-sim kit/usr/bin/* | tee -a "$LAB_OUT/kit-release.txt"
          # Which flutter-aera commit built the kit (kit.json), and the kit run that published it.
          find kit -maxdepth 3 -name kit.json -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; | tee -a "$LAB_OUT/kit-release.txt" || true
          gh run list -R p0g-stack/flutter-aera -L 5 --json databaseId,workflowName,status,conclusion,headSha,createdAt 2>&1 | tee -a "$LAB_OUT/kit-release.txt" || true
      - name: Counter .aerap from flutter_p0g, retargeted to the x64 kit (lab-inputs aera/)
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin lab-inputs && git archive FETCH_HEAD aera | tar -x -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha256sum -c aera/counter-1.0.0.aerap.sha256)
          aera/tools/aerap.py retarget "$RUNNER_TEMP/aera/counter-1.0.0.aerap" "$RUNNER_TEMP/kitx64/kit" "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/job.log"
          aera/tools/aerap.py unpack "$LAB_OUT/counter-1.0.0-x64.aerap" "$RUNNER_TEMP/counter-x64"
      - name: Counter through the kit in recovery (simulated host, frames to PNG)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          taps="--until 9000 --snap start@4000 --tap 980,2250@4500 --tap 980,2250@5000 --tap 980,2250@5500 --snap after@8000"
          sim() { aera/cuttlefish/run-sim.sh "$1" "$RUNNER_TEMP/counter-x64/root" "$RUNNER_TEMP/kitx64/aera-host-sim" $taps $2 2>&1 | tee -a "$LAB_OUT/job.log" || true; }
          # GPU (gfxstream modes): launcher default (Vulkan on gfxstream), Impeller on it, GL forced.
          sim counter-default --gpu
          SWITCHES=--enable-impeller sim counter-impeller --gpu
          # CPU reference: softpipe.
          sim counter-softpipe ""
      - name: vulkaninfo through the kit's launcher and loader
        run: |
          adb=$CF_HOME/bin/adb
          $adb -s 0.0.0.0:6520 shell 'cd /tmp/aera-lab/root && AERA_PLUGIN_ROOT=/tmp/aera-lab/root usr/bin/aera-plugin --vulkan-info' > "$LAB_OUT/vulkan-info.txt" 2>&1 || true
          wc -l "$LAB_OUT/vulkan-info.txt"; head -40 "$LAB_OUT/vulkan-info.txt"
      - name: AERA image (devicelab release from aera/build/publish.sh)
        id: aera
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ github.event.release.tag_name || inputs.aera_release || 'latest' }}"
          [ "$tag" = none ] && exit 0
          case "$tag" in aera-cf-x86_64-*|latest) ;; *) tag=latest ;; esac
          if [ "$tag" = latest ]; then
            tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | startswith("aera-cf-x86_64-"))] | sort_by(.createdAt) | last | .tagName // ""')
          fi
          [ -n "$tag" ] || { echo "no AERA release yet"; exit 0; }
          mkdir -p "$RUNNER_TEMP/aera-img" && cd "$RUNNER_TEMP/aera-img"
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p ramdisk-recovery.img -p BUILD-INFO -p SHA256SUMS
          grep ramdisk-recovery.img SHA256SUMS | sha256sum -c -
          cp BUILD-INFO "$LAB_OUT/aera-BUILD-INFO"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "release $tag"; cat BUILD-INFO
      - name: Boot AERA recovery
        timeout-minutes: 20
        if: steps.aera.outputs.tag != ''
        run: |
          set -o pipefail
          aera/cuttlefish/boot-aera.sh "$RUNNER_TEMP/aera-img/ramdisk-recovery.img" 2>&1 | tee -a "$LAB_OUT/job.log"
          aera/cuttlefish/recovery.sh aera-recovery 2>&1 | tee -a "$LAB_OUT/job.log"
          aera/cuttlefish/aera-diag.sh 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Counter from AERA's launcher (Host API 3, LVGL pixel scene)
        timeout-minutes: 20
        if: steps.aera.outputs.tag != ''
        env: { AERA_TAPS: "${{ inputs.aera_taps }}" }
        run: |
          set -o pipefail
          aera/cuttlefish/aera-open.sh aera-counter "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Remote Home as the first key on a fresh AERA (D8 on the infiniti)
        timeout-minutes: 10
        if: steps.aera.outputs.tag != ''
        run: aera/cuttlefish/aera-home-check.sh "$LAB_OUT/counter-1.0.0-x64.aerap" || true
      - name: D5 A/B, edge-zone tap on the counter via Remote and raw evdev
        timeout-minutes: 10
        if: steps.aera.outputs.tag != ''
        run: aera/cuttlefish/aera-d5-check.sh "$LAB_OUT/counter-1.0.0-x64.aerap" || true
      - name: Raw panel input, D9 slots (0025), still bottom press (F0001), surface (0029)
        timeout-minutes: 10
        if: steps.aera.outputs.tag != ''
        run: aera/cuttlefish/aera-input-check.sh "$LAB_OUT/counter-1.0.0-x64.aerap" || true
      - name: flutter_p0g checkout
        id: p0g
        if: steps.aera.outputs.tag != ''
        run: |
          git clone -q --depth 1 https://github.com/p0g-stack/flutter_p0g "$RUNNER_TEMP/flutter_p0g"
          echo "rev=$(git -C "$RUNNER_TEMP/flutter_p0g" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.p0g.outputs.rev != ''
        with: { flutter-version: 3.47.5, channel: stable }
      - name: flutter_p0g install --ram --open (same package, against the same AERA)
        timeout-minutes: 20
        if: steps.p0g.outputs.rev != ''
        run: |
          set -o pipefail
          export PATH=$CF_HOME/bin:$PATH
          cd "$RUNNER_TEMP/flutter_p0g" && flutter pub get >/dev/null
          echo "flutter_p0g ${{ steps.p0g.outputs.rev }}" | tee "$LAB_OUT/flutter_p0g-install.log"
          dart run bin/flutter_p0g.dart devices 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log" || true
          dart run bin/flutter_p0g.dart install -d 0.0.0.0:6520 --ram --open "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log" || true
          adb -s 0.0.0.0:6520 shell 'ls -la /tmp/aera/plugins /tmp/aera/plugins/counter' 2>&1 | tee -a "$LAB_OUT/flutter_p0g-install.log"
          sleep 20; cd "$GITHUB_WORKSPACE" && aera/cuttlefish/aera-shot.sh flutter_p0g-opened || true
      - name: flutter_p0g run --aera (attach, hot reload, quit) on a fresh `flutter create` counter
        if: steps.p0g.outputs.rev != ''
        run: |
          export PATH=$CF_HOME/bin:$PATH:$HOME/.pub-cache/bin
          dart pub global activate --source path "$RUNNER_TEMP/flutter_p0g" >/dev/null
          cd "$RUNNER_TEMP" && flutter create --project-name counter counter-app >/dev/null && cd counter-app
          # The app in the .aerap is the stock template: edit the title so a reload shows.
          (sleep 90; sed -i 's/Flutter Demo Home Page/Reloaded on AERA/' lib/main.dart; echo r; sleep 20; echo q) \
            | timeout 300 flutter_p0g run --aera --ram -s 0.0.0.0:6520 --aerap "$LAB_OUT/counter-1.0.0-x64.aerap" 2>&1 \
            | tee "$LAB_OUT/flutter_p0g-run.log" || true
          # Where a stalled open stops: the pipes, AERA's own log, who holds the FIFOs
          adb -s 0.0.0.0:6520 shell 'ls -la /system/bin/aerain /system/bin/aeraout; ps -A -o PID,S,WCHAN,NAME,ARGS | grep -vE " \\[|ps -A"; for p in $(pidof recovery); do ls -la /proc/$p/fd | grep -iE "aera|pipe"; done; tail -60 /tmp/recovery.log' \
            > "$LAB_OUT/flutter_p0g-run-state.txt" 2>&1 || true
          cd "$GITHUB_WORKSPACE" && aera/cuttlefish/aera-shot.sh flutter_p0g-reloaded || true
      - name: AERA settings in an app (flutter-aera fadd7b1, 24-hour clock and dynamic_color accent)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 25
        run: |
          export PATH=$CF_HOME/bin:$PATH:$HOME/.pub-cache/bin
          cd "$RUNNER_TEMP" && flutter create --project-name settings_probe settings-probe >/dev/null && cd settings-probe
          cp "$GITHUB_WORKSPACE/aera/apps/settings_probe/lib/main.dart" lib/main.dart && rm -rf test
          flutter pub add dynamic_color 2>&1 | tail -2
          { flutter_p0g create --platforms=aera . && flutter_p0g precache --aera --aera-mode=debug && flutter_p0g build aera --debug; } 2>&1 | tail -20 | tee "$LAB_OUT/settings-probe-build.log"
          "$GITHUB_WORKSPACE/aera/tools/aerap.py" retarget build/aera/*.aerap "$RUNNER_TEMP/kitx64/kit" "$LAB_OUT/settings-probe-x64.aerap" || exit 0
          cd "$GITHUB_WORKSPACE" && aera/cuttlefish/aera-settings-check.sh "$LAB_OUT/settings-probe-x64.aerap"
      - name: AERA file picker in an app (flutter-aera 0018/0019, stock file_selector)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 25
        run: |
          export PATH=$CF_HOME/bin:$PATH:$HOME/.pub-cache/bin
          cd "$RUNNER_TEMP" && flutter create --project-name picker_probe picker-probe >/dev/null && cd picker-probe
          cp "$GITHUB_WORKSPACE/aera/apps/picker_probe/lib/main.dart" lib/main.dart && rm -rf test
          flutter pub add file_selector 2>&1 | tail -2
          { flutter_p0g create --platforms=aera . && flutter_p0g build aera --debug; } 2>&1 | tail -20 | tee "$LAB_OUT/picker-probe-build.log"
          "$GITHUB_WORKSPACE/aera/tools/aerap.py" retarget build/aera/*.aerap "$RUNNER_TEMP/kitx64/kit" "$LAB_OUT/picker-probe-x64.aerap" || exit 0
          cd "$GITHUB_WORKSPACE" && PICK_TAPS="${{ inputs.pick_taps }}" aera/cuttlefish/aera-picker-check.sh "$LAB_OUT/picker-probe-x64.aerap"
      - name: Pixel plugin lifecycle across Home and Recents (flutter-aera 0021/0022)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 25
        run: |
          export PATH=$CF_HOME/bin:$PATH:$HOME/.pub-cache/bin
          cd "$RUNNER_TEMP" && flutter create --project-name lifecycle_probe lifecycle-probe >/dev/null && cd lifecycle-probe
          cp "$GITHUB_WORKSPACE/aera/apps/lifecycle_probe/lib/main.dart" lib/main.dart && rm -rf test
          { flutter_p0g create --platforms=aera . && flutter_p0g build aera --debug; } 2>&1 | tail -20 | tee "$LAB_OUT/lifecycle-probe-build.log"
          "$GITHUB_WORKSPACE/aera/tools/aerap.py" retarget build/aera/*.aerap "$RUNNER_TEMP/kitx64/kit" "$LAB_OUT/lifecycle-probe-x64.aerap" || exit 0
          cd "$GITHUB_WORKSPACE" && RECENTS_CARD="${{ inputs.recents_card }}" aera/cuttlefish/aera-lifecycle-check.sh "$LAB_OUT/lifecycle-probe-x64.aerap"
          aera/cuttlefish/symbolize-cores.sh "${{ steps.aera.outputs.tag }}" || true
      - name: D10, Recents card of a paused pixel plugin (exception trace, no-preview and Browser A/B)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 15
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -f "$LAB_OUT/lifecycle-probe-x64.aerap" ] || exit 0
          aera/cuttlefish/aera-d10-check.sh "$LAB_OUT/lifecycle-probe-x64.aerap" || true
          aera/cuttlefish/symbolize-cores.sh "${{ steps.aera.outputs.tag }}" 
      - name: Where the second tap is lost (plugin vs AERA's own Files card)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 10
        run: '[ -f "$LAB_OUT/lifecycle-probe-x64.aerap" ] && aera/cuttlefish/aera-taps-check.sh "$LAB_OUT/lifecycle-probe-x64.aerap" || true'
      - name: Short and held Back on a pixel plugin, gesture navigation on and off (flutter-aera 0024)
        if: steps.p0g.outputs.rev != ''
        timeout-minutes: 15
        run: '[ -f "$LAB_OUT/lifecycle-probe-x64.aerap" ] && aera/cuttlefish/aera-back-check.sh "$LAB_OUT/lifecycle-probe-x64.aerap" || true'
      - name: Rotate AERA with the counter running (flutter-aera 0020)
        if: steps.aera.outputs.tag != ''
        timeout-minutes: 10
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          aera/cuttlefish/aera-rotate-check.sh "$LAB_OUT/counter-1.0.0-x64.aerap" || true
          aera/cuttlefish/symbolize-cores.sh "${{ steps.aera.outputs.tag }}" 
      - name: Logs
        if: always()
        run: |
          rm -f "$LAB_OUT"/*.aerap
          cp "$CF_HOME"/cuttlefish_runtime/{kernel.log,launcher.log,logcat} "$LAB_OUT"/ 2>/dev/null || true
          tail -30 "$LAB_OUT"/kernel.log 2>/dev/null || true
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ github.job }}"
