# AERA on Cuttlefish (aera/README.md). Boots x86_64 Cuttlefish and its stock
# recovery, records what a plugin host sees there, then runs the counter
# through flutter-aera's x86_64 kit and host simulator inside that recovery.
name: aera-cf
on:
  workflow_dispatch:
    inputs:
      build: { default: "aosp-android-latest-release/aosp_cf_x86_64_only_phone-userdebug" }
      build_id: { default: "" }
  push:
    branches: [main]
    paths: [".github/workflows/aera-cf.yml", "aera/cuttlefish/**", "aera/kit/**"]
permissions:
  contents: write
concurrency: { group: aera-cf, cancel-in-progress: false }
jobs:
  aera-recon:
    runs-on: ubuntu-24.04
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - run: |
          for r in android_bootable_recovery android_device_oneplus_dodge-AERA android_device_oneplus_infiniti-AERA android_manifest android_vendor_recovery; do
            echo "### $r"; gh api "repos/AERA-Recovery/$r/releases?per_page=3" --jq '.[] | "\(.tag_name) \(.published_at)\n" + ([.assets[] | "  \(.name) \(.size) \(.browser_download_url)"] | join("\n"))' 2>&1 | head -20
          done
          curl -fsSL https://aera-recovery.com/ | grep -o 'href="[^"]*"' | sort -u | head -60 || true
          for p in download downloads devices; do echo "### /$p"; curl -fsSL "https://aera-recovery.com/$p" | grep -o 'href="[^"]*"' | sort -u | head -40 || true; done
  arm-kvm:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: ls -l /dev/kvm || true; nproc; grep -m3 -i 'model\|features' /proc/cpuinfo; uname -a; dmesg 2>/dev/null | grep -i kvm | head || sudo dmesg | grep -i kvm | head
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Counter app bundle (debug kernel, architecture independent)
        run: |
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz | tar -C "$RUNNER_TEMP" -xJ
          export PATH=$RUNNER_TEMP/flutter/bin:$PATH
          flutter --disable-analytics >/dev/null
          flutter create --no-pub --project-name counter counter
          cd counter && flutter pub get && flutter build bundle --debug
      - uses: actions/upload-artifact@v4
        with: { name: counter-bundle, path: counter/build/flutter_assets }


  recovery:
    needs: [bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LAB_OUT: ${{ github.workspace }}/out
      CF_HOME: /mnt/cf
    steps:
      - uses: actions/checkout@v4
      - name: KVM and disk
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo mkdir -p "$CF_HOME" && sudo chown "$USER" "$CF_HOME"
          # Cuttlefish wants ~8.5 GB for userdata alone; the runner starts with 14 GB free.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          mkdir -p "$LAB_OUT"; df -h / /mnt; nproc; free -g
      - name: Boot Cuttlefish
        run: set -o pipefail; aera/cuttlefish/up.sh "${{ inputs.build }}" "${{ inputs.build_id }}" 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Android frame
        run: aera/cuttlefish/shot.sh "$LAB_OUT/android.png"
      - name: Stock recovery
        run: set -o pipefail; aera/cuttlefish/recovery.sh stock-recovery 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: flutter-aera x64 kit + static sim (release kit-3.47.5, re-downloaded every run)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kitx64/kit"; cd "$RUNNER_TEMP/kitx64"
          gh release view kit-3.47.5 -R p0g-stack/flutter-aera --json assets --jq '.assets[] | "\(.name) \(.updatedAt)"' | tee "$LAB_OUT/kit-release.txt"
          gh release download kit-3.47.5 -R p0g-stack/flutter-aera --clobber -p 'flutter-aera-kit-linux-x64-*' -p 'aera-host-sim-linux-x64*'
          sha256sum -c ./*.sha256 2>&1 | tee -a "$LAB_OUT/kit-release.txt" || true
          tar -C kit -xJf flutter-aera-kit-linux-x64-*.tar.xz
          sim=$(ls aera-host-sim-linux-x64* | grep -v sha256 | head -1); mv "$sim" aera-host-sim; chmod +x aera-host-sim
          file aera-host-sim kit/usr/bin/* | tee -a "$LAB_OUT/kit-release.txt"
      - uses: actions/download-artifact@v4
        with: { name: counter-bundle, path: "${{ runner.temp }}/payload/usr/share/flutter/flutter_assets" }
      - name: Counter through the kit in recovery (simulated host, frames to PNG)
        run: |
          set -o pipefail
          cp -a "$RUNNER_TEMP/kitx64/kit/." "$RUNNER_TEMP/payload/"; rm -f "$RUNNER_TEMP/payload/kit.json"
          aera/cuttlefish/run-sim.sh counter-sim "$RUNNER_TEMP/payload" "$RUNNER_TEMP/kitx64/aera-host-sim" \
            --until 9000 --snap start@4000 --tap 980,2250@4500 --tap 980,2250@5000 --tap 980,2250@5500 --snap after@8000 \
            2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Logs
        if: always()
        run: |
          cp "$CF_HOME"/cuttlefish_runtime/{kernel.log,launcher.log,logcat} "$LAB_OUT"/ 2>/dev/null || true
          tail -30 "$LAB_OUT"/kernel.log 2>/dev/null || true
      - name: Publish to lab-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "${{ github.workflow }}-${{ github.job }}"
