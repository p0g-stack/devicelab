name: aera-gpu
# Which Cuttlefish gpu_mode gives the guest a 3D virtio-gpu on a GPU-less
# KVM runner: boots Android with each mode (no fallback), then recovery,
# and records the guest's DRM facts and crosvm's logs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/aera-gpu.yml", "aera/cuttlefish/gpu-facts.sh"]
permissions:
  contents: write
jobs:
  mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gpu: [drm_virgl, gfxstream_guest_angle_host_swiftshader, gfxstream_guest_angle_host_lavapipe, gfxstream]
    env:
      LAB_OUT: ${{ github.workspace }}/out
      CF_HOME: /mnt/cf
      CF_GPU: ${{ matrix.gpu }}
      CF_NO_FALLBACK: 1
    steps:
      - uses: actions/checkout@v4
      - name: KVM and disk
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo mkdir -p "$CF_HOME" && sudo chown "$USER" "$CF_HOME"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          mkdir -p "$LAB_OUT"
      - name: Boot Cuttlefish
        run: set -o pipefail; aera/cuttlefish/up.sh 2>&1 | tee -a "$LAB_OUT/job.log"
      - name: Android GPU facts
        run: PATH=$CF_HOME/bin:$PATH aera/cuttlefish/gpu-facts.sh android
      - name: Android frame
        run: aera/cuttlefish/shot.sh "$LAB_OUT/android.png"
      - name: Recovery GPU facts
        run: |
          PATH=$CF_HOME/bin:$PATH aera/cuttlefish/recovery.sh recovery > "$LAB_OUT/recovery.log" 2>&1 || true
          PATH=$CF_HOME/bin:$PATH aera/cuttlefish/gpu-facts.sh recovery
      - name: Logs
        if: always()
        run: |
          cp "$CF_HOME"/cuttlefish_runtime/*.log "$LAB_OUT/" 2>/dev/null || true
          grep -h -iE "virgl|gfxstream|vulkan|egl|gpu|panic|signal|restart" "$CF_HOME"/cuttlefish_runtime/launcher.log 2>/dev/null | tail -60 || true
          sudo dmesg | tail -30 || true
      - name: Publish
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: tools/publish.sh "aera-gpu-${{ matrix.gpu }}" || true
